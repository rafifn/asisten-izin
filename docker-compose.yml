services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: asisten
      POSTGRES_PASSWORD: asisten
      POSTGRES_DB: asisten_izin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asisten -d asisten_izin"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
